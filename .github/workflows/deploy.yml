name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Digital Garden
        uses: actions/checkout@v4
        with:
          repository: chiklitgohil/chiklit-digital-garden
          path: ./chiklit-digital-garden
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Astro
        run: npm run build
      - name: Install dependencies (Garden)
        working-directory: ./chiklit-digital-garden
        run: npm ci
      - name: Build Garden
        working-directory: ./chiklit-digital-garden
        run: npm run build
      - name: Copy Garden to Astro dist
        run: |
          mkdir -p ./dist/garden
          cp -r ./chiklit-digital-garden/dist/* ./dist/garden/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
